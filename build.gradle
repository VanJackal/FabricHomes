plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}


version = project.mod_version
group = project.maven_group

repositories {
    maven {
        name = "Ladysnake Mods"
        url = 'https://maven.ladysnake.org/releases'
    }
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots' }
}

dependencies {
    //to change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // PSA: Some older mods, compiled on Loom 0.2.1, might have outdated Maven POMs.
    // You may need to force-disable transitiveness on them.

    implementation "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cca_version}"
    implementation "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cca_version}"

}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}"}
    }

    doLast {
        def nestedRoot = new File(temporaryDir, "nestedJars")
        def nestedDest = new File(nestedRoot, "META-INF/jars")
        def ccaJars = configurations.compileClasspath.files.findAll {
            it.name.startsWith("cardinal-components-base-") || it.name.startsWith("cardinal-components-entity-")
        }

        delete nestedRoot
        copy {
            from ccaJars
            into nestedDest
        }

        ant.zip(destfile: archiveFile.get().asFile, update: true) {
            zipfileset(dir: nestedRoot)
        }
    }
}
